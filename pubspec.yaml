name: app_infantil_formas
description: "Una aplicación educativa infantil de formas y mates."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  image_path: "assets/icono_app.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  # Aquí registramos la imagen que guardaste en la carpeta assets
  assets:
    - assets/fondo_menu.png
    - assets/fondo_mates.png
    - assets/fondo_formas_menu.png